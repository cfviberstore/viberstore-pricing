name: Update prices

on:
  schedule:
    - cron: '17 5,17 * * *'      # twice a day (a run is ~6 min / ~1,500 requests)
  workflow_dispatch:             # "Run workflow" button in the Actions tab

# The bot needs to push the refreshed data back to the repo.
permissions:
  contents: write

# Never run two updates at once (a manual run during a scheduled one).
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # Parsers and pricing rules must pass before any new data is published.
      - name: Run tests
        run: python -m unittest discover -s tests

      # Exits non-zero (and leaves prices.json untouched) if far fewer Refurbed prices
      # than last time were found - i.e. Refurbed changed their page or blocked us.
      - name: Update prices
        run: python scraper/update_prices.py

      - name: Commit data
        run: |
          git config user.name  "ViberStore Price Bot"
          git config user.email "pricing-bot@users.noreply.github.com"
          git add data/prices.json data/history.json data/slugs.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
